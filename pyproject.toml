[project]
name = "file-mcp-agent"
version = "0.1.0"
description = "Chainlit-based MCP agent with file reading capabilities using FastMCP SSE"
requires-python = ">=3.10"
dependencies = [
    "chainlit>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "httpx-sse>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
